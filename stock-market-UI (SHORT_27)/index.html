<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>NeoMarket — Live Analytical Finance UI</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Poppins,sans-serif}

body{
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  background:#05060a;
  overflow:hidden;
  position:relative;
  transition:background 0.5s ease;
}

/* Theme Toggle Button */
.theme-toggle {
  position:absolute;
  top:20px;
  right:20px;
  width:40px;
  height:40px;
  background:rgba(255,255,255,0.1);
  border-radius:12px;
  display:flex;
  align-items:center;
  justify-content:center;
  cursor:pointer;
  z-index:100;
  border:1px solid rgba(255,255,255,0.2);
  backdrop-filter:blur(10px);
  transition:all 0.3s;
  box-shadow:0 4px 15px rgba(0,0,0,0.2);
}

.theme-toggle:hover {
  transform:scale(1.1);
  background:rgba(255,255,255,0.15);
  box-shadow:0 6px 20px rgba(0,0,0,0.3);
}

.theme-toggle i {
  font-size:18px;
  color:#fff;
  transition:transform 0.3s;
}

.theme-toggle:hover i {
  transform:rotate(180deg);
}

/* Enhanced Ambient background with dynamic glow */
.ambient-light {
  position:absolute;
  border-radius:50%;
  filter:blur(120px);
  opacity:0.4;
  z-index:1;
  transition:all 0.8s ease;
}

.ambient-cyan {
  width:500px;
  height:500px;
  top:-150px;
  left:-150px;
  animation:float-cyan 15s ease-in-out infinite alternate;
}

.ambient-purple {
  width:600px;
  height:600px;
  bottom:-200px;
  right:-200px;
  animation:float-purple 18s ease-in-out infinite alternate-reverse;
}

.ambient-pink {
  width:400px;
  height:400px;
  top:50%;
  left:50%;
  transform:translate(-50%, -50%);
  animation:pulse-glow 8s ease-in-out infinite;
}

@keyframes float-cyan {
  0% { transform:translate(-100px, -50px) scale(1); }
  50% { transform:translate(50px, 100px) scale(1.1); }
  100% { transform:translate(-150px, 80px) scale(1); }
}

@keyframes float-purple {
  0% { transform:translate(100px, 80px) scale(1); }
  50% { transform:translate(-80px, -100px) scale(1.2); }
  100% { transform:translate(150px, -50px) scale(1); }
}

@keyframes pulse-glow {
  0%, 100% { opacity:0.3; transform:translate(-50%, -50%) scale(1); }
  50% { opacity:0.6; transform:translate(-50%, -50%) scale(1.3); }
}

/* Animated background particles */
.particles {
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  z-index:0;
}

.particle {
  position:absolute;
  width:2px;
  height:2px;
  border-radius:50%;
  animation:float-particle linear infinite;
}

@keyframes float-particle {
  0% {
    transform:translateY(100vh) translateX(0);
    opacity:0;
  }
  10% {
    opacity:0.5;
  }
  90% {
    opacity:0.5;
  }
  100% {
    transform:translateY(-100px) translateX(var(--tx, 0));
    opacity:0;
  }
}

/* Enhanced Frame with glowing effect */
.frame{
  width:360px;
  height:640px;
  border-radius:30px;
  padding:22px;
  background:rgba(255,255,255,0.07);
  backdrop-filter:blur(25px);
  color:#fff;
  position:relative;
  z-index:2;
  overflow:hidden;
  border:1px solid rgba(255,255,255,0.15);
  box-shadow:
    0 8px 32px rgba(0,0,0,0.3),
    0 0 0 1px rgba(255,255,255,0.05),
    inset 0 1px 0 rgba(255,255,255,0.1);
  animation:frame-glow 4s ease-in-out infinite alternate;
  transition:all 0.5s ease;
}

@keyframes frame-glow {
  0% {
    box-shadow:
      0 8px 32px rgba(0,0,0,0.3),
      0 0 0 1px rgba(255,255,255,0.05),
      inset 0 1px 0 rgba(255,255,255,0.1);
  }
  100% {
    box-shadow:
      0 8px 32px rgba(0,0,0,0.3),
      0 0 0 1px rgba(255,255,255,0.05),
      inset 0 1px 0 rgba(255,255,255,0.1);
  }
}

/* Inner glow effect */
.frame::before {
  content:'';
  position:absolute;
  top:0;
  left:0;
  right:0;
  bottom:0;
  border-radius:30px;
  background:linear-gradient(135deg, 
    rgba(0,242,254,0.1) 0%,
    rgba(127,0,255,0.1) 100%);
  z-index:-1;
  opacity:0.5;
  animation:inner-glow 6s ease-in-out infinite alternate;
  transition:all 0.5s ease;
}

@keyframes inner-glow {
  0% { opacity:0.3; }
  100% { opacity:0.7; }
}

/* Header */
.header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:5px;
  position:relative;
}
.header h3{
  font-weight:500;
  color:#fff;
  text-shadow:0 0 20px currentColor;
  animation:text-glow 3s ease-in-out infinite alternate;
  transition:all 0.5s ease;
}

@keyframes text-glow {
  0% { text-shadow:0 0 20px currentColor; }
  100% { text-shadow:0 0 30px currentColor; }
}

.live-indicator{
  display:flex;
  align-items:center;
  font-size:11px;
  padding:4px 10px;
  border-radius:12px;
  animation:pulse 2s infinite;
  border:1px solid;
  box-shadow:0 0 15px currentColor;
  transition:all 0.5s ease;
}
.live-dot{
  width:6px;
  height:6px;
  border-radius:50%;
  margin-right:6px;
  animation:blink 1s infinite;
  box-shadow:0 0 10px currentColor;
  transition:all 0.5s ease;
}

@keyframes pulse{
  0%,100%{ 
    box-shadow:0 0 15px currentColor;
    transform:scale(1);
  }
  50%{
    box-shadow:0 0 25px currentColor;
    transform:scale(1.05);
  }
}
@keyframes blink{
  0%,100%{ 
    opacity:1;
    box-shadow:0 0 10px currentColor;
  }
  50%{
    opacity:0.3;
    box-shadow:0 0 5px currentColor;
  }
}

/* Tabs with glow effect */
.tabs{
  display:flex;
  background:rgba(255,255,255,0.08);
  border-radius:18px;
  padding:6px;
  margin:12px 0;
  border:1px solid rgba(255,255,255,0.15);
  backdrop-filter:blur(10px);
  box-shadow:0 4px 20px rgba(0,0,0,0.2);
  transition:all 0.5s ease;
}
.tab{
  flex:1;
  text-align:center;
  padding:10px;
  font-size:13px;
  cursor:pointer;
  opacity:.6;
  border-radius:14px;
  transition:.4s;
  background:transparent;
  position:relative;
  overflow:hidden;
}
.tab::before {
  content:'';
  position:absolute;
  top:0;
  left:0;
  right:0;
  bottom:0;
  border-radius:14px;
  opacity:0;
  transition:opacity 0.4s;
}
.tab.active{
  opacity:1;
  border:1px solid;
  transition:all 0.5s ease;
}
.tab.active::before {
  opacity:1;
}
.tab span {
  position:relative;
  z-index:1;
  color:#fff;
}

/* List with enhanced glassmorphism and glow */
.item{
  padding:14px;
  border-radius:18px;
  margin-bottom:10px;
  background:rgba(255,255,255,0.05);
  cursor:pointer;
  display:flex;
  justify-content:space-between;
  align-items:center;
  border:1px solid rgba(255,255,255,0.1);
  backdrop-filter:blur(10px);
  transition:all 0.3s ease;
  position:relative;
  overflow:hidden;
  box-shadow:0 4px 15px rgba(0,0,0,0.1);
}
.item::before{
  content:"";
  position:absolute;
  top:0;
  left:-100%;
  width:100%;
  height:100%;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,0.1),transparent);
  transition:0.5s;
}
.item:hover::before{
  left:100%;
}
.item:hover{
  transform:translateY(-2px);
  background:rgba(255,255,255,0.08);
  border-color:currentColor;
  box-shadow:0 6px 25px currentColor;
}
.item-content{flex:1}
.item h4{
  font-size:14px;
  margin-bottom:4px;
  font-weight:500;
  color:#fff;
  transition:all 0.5s ease;
}
.item span{
  font-size:11px;
  opacity:.7;
  display:block;
  color:rgba(255,255,255,0.7);
}

/* Mini Graph with glow */
.mini-graph{
  width:60px;
  height:24px;
  margin-left:10px;
  position:relative;
  filter:drop-shadow(0 0 5px currentColor);
}
.mini-graph svg{
  width:100%;
  height:100%;
}

/* Performance indicator */
.perf-indicator{
  text-align:right;
  margin-left:12px;
  min-width:70px;
}
.perf-rupee{
  font-size:13px;
  font-weight:600;
  margin-bottom:2px;
  transition:all 0.5s ease;
  text-shadow:0 0 10px currentColor;
}
.perf-percent{
  font-size:11px;
  font-weight:500;
  transition:all 0.5s ease;
  text-shadow:0 0 8px currentColor;
}

/* Color classes for performance with glow */
.positive-rupee{
  animation:positive-glow 2s infinite alternate;
}
.positive-percent{
  animation:positive-glow 2s infinite alternate;
}
.negative-rupee{
  animation:negative-glow 2s infinite alternate;
}
.negative-percent{
  animation:negative-glow 2s infinite alternate;
}

@keyframes positive-glow {
  0% { text-shadow:0 0 5px currentColor; }
  100% { text-shadow:0 0 15px currentColor; }
}

@keyframes negative-glow {
  0% { text-shadow:0 0 5px currentColor; }
  100% { text-shadow:0 0 15px currentColor; }
}

/* Current price */
.current-price{
  font-size:12px;
  opacity:0.9;
  margin-top:2px;
  font-weight:500;
  color:rgba(255,255,255,0.9);
}

/* Modal with enhanced glow */
.modal{
  position:absolute;
  inset:0;
  background:rgba(0,0,0,0.85);
  backdrop-filter:blur(10px);
  display:none;
  align-items:center;
  justify-content:center;
  z-index:10;
}
.modal.active{display:flex}

.modal-box{
  width:92%;
  background:rgba(255,255,255,0.08);
  backdrop-filter:blur(30px);
  border-radius:26px;
  padding:20px;
  animation:pop .4s ease;
  border:1px solid rgba(255,255,255,0.2);
  box-shadow:
    0 20px 60px rgba(0,0,0,0.5),
    0 0 50px currentColor;
  position:relative;
  overflow:hidden;
  transition:all 0.5s ease;
}

.modal-box::before {
  content:'';
  position:absolute;
  top:0;
  left:0;
  right:0;
  bottom:0;
  background:linear-gradient(135deg, 
    rgba(255,255,255,0.1) 0%,
    rgba(255,255,255,0.1) 100%);
  z-index:-1;
  opacity:0.5;
}

@keyframes pop{
  from{
    transform:scale(.85);
    opacity:0;
    box-shadow:0 0 0 rgba(0,0,0,0);
  }
  to{
    transform:scale(1);
    opacity:1;
    box-shadow:
      0 20px 60px rgba(0,0,0,0.5),
      0 0 50px currentColor;
  }
}

.modal-header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:5px;
}
.modal-header h2{
  font-size:18px;
  font-weight:600;
  color:#fff;
  text-shadow:0 0 20px currentColor;
  transition:all 0.5s ease;
}
.modal-sub{
  font-size:11px;
  opacity:.8;
  margin-bottom:15px;
  color:rgba(255,255,255,0.8);
}

/* Live chart with glow */
.live-chart{
  height:150px;
  margin:12px 0;
  position:relative;
}
.live-chart svg{
  width:100%;
  height:100%;
  filter:drop-shadow(0 0 10px currentColor);
}
.chart-path{
  fill:none;
  stroke:url(#grad);
  stroke-width:3;
  stroke-linecap:round;
  stroke-linejoin:round;
  filter:drop-shadow(0 0 8px currentColor);
  transition:all 0.5s ease;
}

/* Enhanced Metrics with glow */
.metrics{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  margin-top:15px;
}
.metric{
  background:rgba(255,255,255,0.05);
  padding:12px;
  border-radius:14px;
  border:1px solid rgba(255,255,255,0.1);
  backdrop-filter:blur(5px);
  transition:all 0.3s;
}
.metric:hover {
  background:rgba(255,255,255,0.08);
  border-color:currentColor;
  transform:translateY(-2px);
  box-shadow:0 5px 20px currentColor;
}
.metric span{
  font-size:11px;
  opacity:.7;
  display:block;
  margin-bottom:4px;
  color:rgba(255,255,255,0.7);
}
.metric strong{
  display:block;
  font-size:13px;
  font-weight:600;
  color:#fff;
}

.positive{
  text-shadow:0 0 10px currentColor;
  animation:positive-glow 2s infinite alternate;
}
.negative{
  text-shadow:0 0 10px currentColor;
  animation:negative-glow 2s infinite alternate;
}
.neutral{
  text-shadow:0 0 8px currentColor;
}

.close{
  text-align:center;
  margin-top:12px;
  font-size:12px;
  opacity:.7;
  cursor:pointer;
  padding:8px;
  border-radius:10px;
  background:rgba(255,255,255,0.05);
  border:1px solid rgba(255,255,255,0.1);
  transition:all 0.3s;
  backdrop-filter:blur(5px);
  color:#fff;
}
.close:hover{
  background:rgba(255,255,255,0.1);
  opacity:1;
  border-color:currentColor;
  box-shadow:0 0 15px currentColor;
}

  const theme = themes[themeIndex];
  
  // Update CSS variables
  document.documentElement.style.setProperty('--current-primary', theme.primary);

  document.documentElement.style.setProperty('--current-accent', theme.accent);
  document.documentElement.style.setProperty('--current-positive', theme.positive);
  document.documentElement.style.setProperty('--current-negative', theme.negative);
  document.documentElement.style.setProperty('--current-neutral', theme.neutral);
  
  // Update body class
  document.body.className = `theme-${themeIndex}`;
  
  // Update gradient in chart
  const gradStop1 = document.querySelector('#grad stop:nth-child(1)');
  const gradStop2 = document.querySelector('#grad stop:nth-child(2)');
  if (gradStop1) gradStop1.setAttribute('stop-color', theme.primary);
  if (gradStop2) gradStop2.setAttribute('stop-color', theme.secondary);
  
  // Update particles color
  updateParticlesColor(theme.primary);
  
  // Update mini-graph colors for existing stocks
  updateStockColors(theme.positive, theme.negative);
  
  currentTheme = themeIndex;
}

          percentElement.style.color = positiveColor;
        } else {
          rupeeElement.style.color = negativeColor;
          percentElement.style.color = negativeColor;

      }
    }
  });
}

  const volMap = { 'Low': 0.2, 'Medium': 0.5, 'High': 1, 'Extreme': 2 };
  const volatilityFactor = volMap[volatility] || 0.5;
  const change = (Math.random() - 0.5) * volatilityFactor * 2;
  return base * (1 + change / 100);
}

      <div class="mini-graph">
        <svg viewBox="0 0 60 24">
          <path d="${graphPoints}" fill="none" stroke="${isPositive ? themes[currentTheme].positive : themes[currentTheme].negative}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>
      <div class="perf-indicator">
        <div class="perf-rupee ${rupeeColor}">${rupeeSign}₹${Math.abs(stock.dailyChange).toFixed(2)}</div>
        <div class="perf-percent ${percentColor}">${percentSign}${Math.abs(stock.dailyPercent).toFixed(2)}%</div>
      </div>
    `;
    
    container.appendChild(stockElement);
  });
}

// Generate mini graph points
function generateMiniGraph(history) {
  if(history.length < 2) return "M0,12 L60,12";
  
  const points = [];
  const min = Math.min(...history);
  const max = Math.max(...history);
  const range = max - min || 1;
  
  history.slice(-10).forEach((value, i) => {
    const x = (i / (history.length - 1)) * 60;
    const y = 22 - ((value - min) / range) * 20;
    points.push(`${i === 0 ? 'M' : 'L'}${x},${y}`);
  });
  
  return points.join(' ');
}

// Generate main chart
function generateMainChart(history) {
  if(history.length < 2) return "M0,75 L300,75";
  
  const points = [];
  const min = Math.min(...history);
  const max = Math.max(...history);
  const range = max - min || 1;
  
  history.forEach((value, i) => {
    const x = (i / (history.length - 1)) * 300;
    const y = 140 - ((value - min) / range) * 120;
    points.push(`${i === 0 ? 'M' : 'L'}${x},${y}`);
  });
  
  return points.join(' ');
}

// Open stock modal

  currentStock = stock;
  
  document.getElementById('mTitle').textContent = stock.name;
  document.getElementById('mSub').textContent = "Live Equity Analysis";
  
  const isPositive = stock.dailyChange >= 0;
  const rupeeSign = stock.dailyChange >= 0 ? '+' : '';
  const percentSign = stock.dailyPercent >= 0 ? '+' : '';
  
  // Update metrics
  document.getElementById('metrics').innerHTML = `
    <div class="metric">
      <span>Current Price</span>
      <strong>₹${stock.price.toFixed(2)}</strong>
    </div>
    <div class="metric">
      <span>Daily ₹ Change</span>
      <strong class="${isPositive ? 'positive' : 'negative'}">${rupeeSign}₹${Math.abs(stock.dailyChange).toFixed(2)}</strong>
    </div>
    <div class="metric">
      <span>Daily %</span>
      <strong class="${isPositive ? 'positive' : 'negative'}">${percentSign}${Math.abs(stock.dailyPercent).toFixed(2)}%</strong>
    </div>
    <div class="metric">
      <span>Volume</span>
      <strong>${stock.volume}</strong>
    </div>
    <div class="metric">
      <span>Volatility</span>
      <strong class="neutral">${stock.volatility}</strong>
    </div>
    <div class="metric">
      <span>Analyst Bias</span>
      <strong class="${stock.bias === 'Buy' ? 'positive' : stock.bias === 'Sell' ? 'negative' : 'neutral'}">${stock.bias}</strong>
    </div>
  `;
  
  // Update chart
  const chartPath = document.querySelector('#mainChart .chart-path');
  chartPath.setAttribute('d', generateMainChart(stock.history));
  chartPath.style.stroke = isPositive ? themes[currentTheme].positive : themes[currentTheme].negative;
  
  document.getElementById('modal').classList.add('active');
}

// Update modal with latest data
function updateModal(stock) {
  if(!document.getElementById('modal').classList.contains('active')) return;
  
  const isPositive = stock.dailyChange >= 0;
  const rupeeSign = stock.dailyChange >= 0 ? '+' : '';
  const percentSign = stock.dailyPercent >= 0 ? '+' : '';
  
  // Update metrics dynamically
  const metrics = document.querySelectorAll('.metric strong');
  if(metrics.length >= 6) {
    metrics[0].textContent = `₹${stock.price.toFixed(2)}`;
    metrics[1].textContent = `${rupeeSign}₹${Math.abs(stock.dailyChange).toFixed(2)}`;
    metrics[1].className = isPositive ? 'positive' : 'negative';
    metrics[2].textContent = `${percentSign}${Math.abs(stock.dailyPercent).toFixed(2)}%`;
    metrics[2].className = isPositive ? 'positive' : 'negative';
    metrics[3].textContent = stock.volume;
  }
  
  // Update chart
  const chartPath = document.querySelector('#mainChart .chart-path');
  chartPath.setAttribute('d', generateMainChart(stock.history));
  chartPath.style.stroke = isPositive ? themes[currentTheme].positive : themes[currentTheme].negative;
}
