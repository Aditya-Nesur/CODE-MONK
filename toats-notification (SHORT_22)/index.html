<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Multi Theme Toast Demo</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Poppins,sans-serif}

/* ================= THEME VARIABLES ================= */
:root{
  --bg1:#0f1424;
  --bg2:#070a12;
  --accent:#448aff;
  --accent-soft:#448aff33;
}

/* BODY */
body{
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  background:radial-gradient(circle at top,#0b1020,#02030a);
}

/* FRAME */
.frame{
  width:360px;
  height:640px;
  border-radius:26px;
  position:relative;
  overflow:hidden;

  background:
    radial-gradient(circle at top right,var(--accent-soft),transparent 45%),
    linear-gradient(180deg,var(--bg1),var(--bg2));

  box-shadow:
    0 40px 120px rgba(0,0,0,.85),
    inset 0 0 0 1px rgba(255,255,255,.05);
}

/* MOVING LIGHT */
.frame::before{
  content:"";
  position:absolute;
  inset:-40%;
  background:radial-gradient(circle,var(--accent-soft),transparent 60%);
  filter:blur(160px);
  animation:float 14s linear infinite;
  pointer-events:none;
}

@keyframes float{
  0%{transform:translate(-10%,-10%)}
  50%{transform:translate(10%,10%)}
  100%{transform:translate(-10%,-10%)}
}

/* AMBIENT */
.ambient{
  position:absolute;
  inset:-120px;
  filter:blur(140px);
  opacity:.45;
  pointer-events:none;
  transition:.6s ease;
}

/* HEADER */
.header{
  padding:24px 20px 12px;
  color:#fff;
}
.header h1{font-size:18px;font-weight:600}
.header p{font-size:12px;opacity:.55}

/* THEME TOGGLE */
.theme-toggle{
  position:absolute;
  top:18px;
  right:18px;
  background:linear-gradient(135deg,#1e2440,#151b30);
  border:none;
  border-radius:14px;
  padding:8px 12px;
  font-size:11px;
  color:#fff;
  cursor:pointer;
  box-shadow:0 10px 20px rgba(0,0,0,.5);
}

/* CARD */
.card{
  margin:18px;
  padding:18px;
  border-radius:18px;
  background:linear-gradient(180deg,#151b2f,#0f1424);
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.06),
             0 20px 40px rgba(0,0,0,.55);
  color:#fff;
}
.card span{font-size:11px;opacity:.6}
.card h2{margin-top:6px;font-size:26px;font-weight:600}

/* STATUS */
.status{
  margin:0 18px;
  font-size:12px;
  color:#9aa3ff;
}

/* CONTROLS */
.controls{
  position:absolute;
  bottom:24px;
  width:100%;
  display:flex;
  justify-content:center;
  gap:10px;
}

.controls button{
  padding:10px 14px;
  border:none;
  border-radius:18px;
  font-size:11px;
  cursor:pointer;
  color:#fff;
  background:linear-gradient(135deg,#1e2440,#151b30);
  transition:.25s;
}
.controls button:hover{transform:translateY(-1px)}

/* TOASTS */
.toasts{
  position:absolute;
  top:18px;
  right:18px;
  display:flex;
  flex-direction:column;
  gap:12px;
  z-index:10;
}

.toast{
  width:260px;
  padding:14px;
  border-radius:14px;
  display:flex;
  gap:12px;
  background:linear-gradient(180deg,#181e35,#12172a);
  box-shadow:0 16px 32px rgba(0,0,0,.65);
  animation:slideIn .55s cubic-bezier(.2,.8,.2,1);
  position:relative;
}

.toast::after{
  content:"";
  position:absolute;
  left:0;
  bottom:0;
  height:3px;
  width:100%;
  animation:progress 4s linear forwards;
}

.icon{
  width:34px;
  height:34px;
  border-radius:10px;
  display:flex;
  align-items:center;
  justify-content:center;
}

.text strong{font-size:13px;color:#fff}
.text span{font-size:11px;color:#cfd3ff}

/* TYPES */
.success .icon{background:#00e67622;color:#00e676}
.success::after{background:#00e676}

.error .icon{background:#ff525222;color:#ff5252}
.error::after{background:#ff5252}

.info .icon{background:#448aff22;color:#448aff}
.info::after{background:#448aff}

.warn .icon{background:#ffca2822;color:#ffca28}
.warn::after{background:#ffca28}

/* ANIM */
@keyframes slideIn{
  from{transform:translateX(120%);opacity:0}
  to{transform:translateX(0);opacity:1}
}
@keyframes slideOut{
  to{transform:translateX(120%);opacity:0}
}
@keyframes progress{
  from{width:100%}
  to{width:0}
}
</style>
</head>

<body>

<div class="frame">

  <button class="theme-toggle" onclick="toggleTheme()">Theme</button>
  <div class="ambient" id="ambient"></div>

  <div class="header">
    <h1>Wallet</h1>
    <p>Multi-theme demo</p>
  </div>

  <div class="card">
    <span>Available Balance</span>
    <h2 id="balance">₹ 2,450.00</h2>
  </div>

  <div class="status" id="status">Idle</div>

  <div class="toasts" id="toasts"></div>

  <div class="controls">
    <button onclick="sendPayment()">Send</button>
    <button onclick="showInfo()">Info</button>
    <button onclick="lowBalance()">Low</button>
    <button onclick="reset()">Reset</button>
  </div>

</div>

<script>
const root = document.documentElement;
const ambient = document.getElementById("ambient");
const toasts = document.getElementById("toasts");
const balanceEl = document.getElementById("balance");
const statusEl = document.getElementById("status");

let balance = 2450;

/* ================= THEMES ================= */
const themes = [
  {bg1:"#0f1424",bg2:"#070a12",accent:"#448aff"},
  {bg1:"#1b1030",bg2:"#090013",accent:"#e040fb"},
  {bg1:"#00251a",bg2:"#00130d",accent:"#00e676"},
  {bg1:"#261200",bg2:"#120700",accent:"#ff9100"},
  {bg1:"#240000",bg2:"#120000",accent:"#ff5252"},
  {bg1:"#00131a",bg2:"#00090f",accent:"#00bcd4"},
  {bg1:"#1a1400",bg2:"#0f0a00",accent:"#ffca28"},
  {bg1:"#0b1a2a",bg2:"#040b12",accent:"#40c4ff"},
  {bg1:"#1a0f24",bg2:"#0c0612",accent:"#b388ff"},
  {bg1:"#0f1a12",bg2:"#060c09",accent:"#69f0ae"}
];

let themeIndex = 0;

function toggleTheme(){
  themeIndex = (themeIndex + 1) % themes.length;
  const t = themes[themeIndex];

  root.style.setProperty("--bg1",t.bg1);
  root.style.setProperty("--bg2",t.bg2);
  root.style.setProperty("--accent",t.accent);
  root.style.setProperty("--accent-soft",t.accent+"33");

  ambient.style.background =
    `radial-gradient(circle,${t.accent}66,transparent 60%)`;
}

/* ================= TOAST ================= */
function toast(type,title,msg,icon){
  const el = document.createElement("div");
  el.className = `toast ${type}`;
  el.innerHTML = `
    <div class="icon">${icon}</div>
    <div class="text">
      <strong>${title}</strong>
      <span>${msg}</span>
    </div>
  `;
  toasts.appendChild(el);

  setTimeout(()=>{
    el.style.animation="slideOut .4s ease forwards";
    setTimeout(()=>el.remove(),400);
  },4000);
}

/* ================= EVENTS ================= */
function sendPayment(){
  statusEl.textContent="Processing…";
  toast("info","Processing","Sending ₹850","i");

  setTimeout(()=>{
    if(Math.random()>0.3){
      balance-=850;
      balanceEl.textContent=`₹ ${balance.toLocaleString()}.00`;
      statusEl.textContent="Success";
      toast("success","Payment Sent","₹850 transferred","✓");
    }else{
      statusEl.textContent="Failed";
      toast("error","Payment Failed","Server error","!");
    }
  },2000);
}

function showInfo(){
  toast("info","Update","Security patch ready","i");
}

function lowBalance(){
  toast("warn","Low Balance","Recharge soon","!");
}

function reset(){
  balance=2450;
  balanceEl.textContent="₹ 2,450.00";
  statusEl.textContent="Idle";
}
</script>

</body>
</html>
